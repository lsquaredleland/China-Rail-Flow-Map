    <style>

          --teal: #2BB5AC;
          --saffron: #F1B94E;
          --rule: #2E3035;
          --context-grey: #3A3335;
          --panel: #1A1B1E;
          --panel-edge: #EDEDEA;
          --btn-bg: #1A1B1E;
          --btn-on: #EDEDEA;
          --btn-on-ink: #111214;
          --field: #1A1B1E;
          --row-alt: #17181B;
          --tooltip-bg: #1A1B1E;
          --tooltip-ink: #EDEDEA;
          --shadow-panel: 0 1px 3px rgba(0, 0, 0, 0.6), 0 8px 24px rgba(0, 0, 0, 0.5);

        --indigo: #8F9CF2;
        --teal: #2BB5AC;
        --saffron: #F1B94E;

      button { cursor: pointer; }

      }
      button:focus-visible, select:focus-visible { outline: 2px solid var(--rust); outline-offset: 1px; }

        color: var(--ink-soft);
        background: var(--btn-bg);
        cursor: not-allowed;
        pointer-events: none;
        transform: none;

      .units button:last-child { border-radius: 0 3px 3px 0; margin-left: -1.5px; }

      #originList .opt {

      #tooltip td { padding: 1.5px 8px 1.5px 0; font-size: 12px; font-variant-numeric: tabular-nums; }

      #legendCol {

      #scalebar .sb-label {
        font-size: 11px;

      #scalebar .sb-bar {

      #legend {

      :root[data-theme="dark"] .lg-band-label { fill: #111214 !important; }

      #destPanel {
