    <script>
      (function () {
        try {
          var p = new URLSearchParams(window.location.search).get("theme");
          var s = sessionStorage.getItem("crfa-theme");
          var d = (p === "dark" || p === "night") ? true : (p === "light" || p === "day") ? false : s ? s === "dark" : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
