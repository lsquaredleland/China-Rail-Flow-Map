[package]
name = "analyze-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
quick-xml = "0.38"
brotli = "9"
rayon = "1.12"
sha2 = "0.10"

[dev-dependencies]
# Reference reader: tests check our hand-written files against it.
safetensors = "0.8"
