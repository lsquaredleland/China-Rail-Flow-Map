# The recipe's router config (docs/PIPELINE.md section 3 step 5:
# corridor-router ... --config ../pipeline/router/recipe.toml).
# Everything not set here is Config::default(); see `--dump-config`.
#
# Canonical pair geometry: production's path, unless the pair's timetabled
# legs favour another gap-free candidate (pipeline/router/README.md). The
# margins were picked on a train-hash tune/holdout split (PR #23).
[canon]
mode = "hybrid"
margin_min = 1.0
longer_min_per_km = 0.1
margin_rel = 0.2
min_legs = 1
# Only pairs where the router disagrees with production on some leg may leave
# production: switched / filled / bridge-fix onto a non-production candidate,
# or ambiguous-keep whose best guess is not production's.
require_router_agreement = true

# The schedule source (pipeline/router/README.md, "Plugging in a new
# schedule"). The shipped pack (since 2026-10-25) is built from the train
# export: one export with an operating calendar, paths relative to --files
# (data/raw/train-exports-2026-10-25). The 12306 source is still available:
# to build the 12306 pack, use a copy of this file with
#   source = "timetables"
# and no `export` / `supplements` lines, with --files pointing at the two
# timetable deliverables (docs/PIPELINE.md section 3 step 5).
[schedule]
source = "export"
export = "trains-all.json"
supplements = ["train-operating-days.json"]

# A train runs a leg without stopping, so a candidate path that turns back
# between its two stations (at a junction, say) is penalised per turn-back
# in the run-time model (pipeline/router/README.md).
[model]
inner_reversal_penalty = 2.0
