name: CI

on:
  push:
    branches: [main, deckgl]
  pull_request:
    branches: [main, deckgl]

# Superseded runs on the same PR cancel; pushes to main/deckgl always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts of the repo changed. On push everything runs (cheap insurance);
  # on a PR, jobs whose inputs are untouched are skipped (reported green).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ github.event_name != 'pull_request' || steps.f.outputs.web == 'true' }}
      pipeline: ${{ github.event_name != 'pull_request' || steps.f.outputs.pipeline == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3.0.2
        id: f
        if: github.event_name == 'pull_request'
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/**'
            pipeline:
              - 'pipeline/**'
              - 'web/public/assets/**'
              - '.github/workflows/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test

  # Headless WebGL smoke: with the Canvas renderer gone, nothing else boots the
  # lazy deck chunk. SwiftShader software GL on the runner's preinstalled Chrome
  # (no browser download, so nothing to cache); deterministic assertions only,
  # no pixel comparison. smoke and cards-layout run as parallel jobs; each
  # rebuilds dist (about 10 s with a warm bun cache, cheaper than an artifact
  # round-trip).
  web-smoke:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Boot dist in headless Chrome (SwiftShader)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/smoke.mjs

  web-cards-layout:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Check cards layout in headless Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/cards-layout.mjs

  # O12: audit the committed pack. CI cannot rebuild it (needs the OSM
  # extract), but --pack-only needs only the pack files and goldens.json.
  # dropped_chains / flow_lost are not gated here: they need the OSM extract
  # (see audit_pack in audit.rs).
  pack-audit:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline

      - name: audit --pack-only against goldens.json
        working-directory: pipeline
        env:
          # audit reads the committed .json.br files directly
          AUDIT_PACK_DIR: ${{ github.workspace }}/web/public/assets
        run: cargo run --release -p analyze-rs --bin audit -- --pack-only --goldens goldens.json

  # O12: on a PR that changes the committed pack, diff it against the base
  # branch's and post a summary comment (updated in place). Skipped when the
  # pack files are unchanged. Fork PRs get a read-only token: the summary goes
  # to the job summary only.
  pack-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the committed pack change?
        id: changed
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE" HEAD -- 'web/public/assets/atlas-v2-*.json.br'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pack unchanged vs $BASE; nothing to post"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the base branch's pack
        if: steps.changed.outputs.changed == 'true'
        env:
          BASE: ${{ github.base_ref }}
        run: git worktree add "$RUNNER_TEMP/base" "origin/$BASE"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.changed == 'true'
        with:
          workspaces: pipeline

      - name: secdiff --packs
        if: steps.changed.outputs.changed == 'true'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          {
            echo '<!-- pack-diff -->'
            echo "## Pack diff vs \`$BASE\`"
            echo
            cargo run --release --manifest-path pipeline/Cargo.toml -p analyze-rs --bin secdiff -- \
              --packs "$RUNNER_TEMP/base/web/public/assets" web/public/assets
          } > "$RUNNER_TEMP/pack-diff.md"
          cat "$RUNNER_TEMP/pack-diff.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the PR comment
        if: >-
          steps.changed.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/pack-diff.md`, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const mine = comments.find((c) => c.body && c.body.startsWith('<!-- pack-diff -->'));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  pipeline:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
