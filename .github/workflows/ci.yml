name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test

  # O12: audit the committed pack. CI cannot rebuild it (needs the OSM
  # extract), but --pack-only needs only the pack files and goldens.json.
  pack-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline

      - name: Brotli-decode the committed pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          for f in web/public/assets/atlas-v2-*.json.br; do
            b=$(basename "$f" .br)
            node -e 'const z=require("zlib"),fs=require("fs");fs.writeFileSync(process.argv[2],z.brotliDecompressSync(fs.readFileSync(process.argv[1])))' "$f" "$RUNNER_TEMP/pack/$b"
          done
          ls -l "$RUNNER_TEMP/pack"

      - name: audit --pack-only against goldens.json
        working-directory: pipeline
        env:
          AUDIT_PACK_DIR: ${{ runner.temp }}/pack
        run: cargo run --release -p analyze-rs --bin audit -- --pack-only --goldens goldens.json

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
